<!-- Clay'sCars.com - Starter Prototype (simple result view) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clay'sCars.com - Madison, IN</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { background: #0074D9; color: white; padding: 1rem; text-align: center; }
    .container { padding: 2rem; max-width: 800px; margin: auto; }
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    label { font-weight: bold; margin-right: 0.5rem; }
    select, button { padding: 0.5rem; font-size: 1rem; }
    button { background: #0074D9; color: white; border: none; cursor: pointer; }
    button:hover { background: #005fa3; }
    .car-result { background: white; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #0074D9; }
    .car-result h3 { margin: 0 0 0.5rem 0; font-size: 1.2rem; }
    .car-result a { text-decoration: none; color: #0074D9; }
    .car-result a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Clay'sCars.com</h1>
    <p>All Cars in Madison, Indiana</p>
  </header>
  <div class="container">
    <div class="search-box">
      <label for="make">Make:</label>
      <select id="make"></select>
      <label for="model">Model:</label>
      <select id="model"></select>
      <label for="year">Year:</label>
      <select id="year"></select>
      <button onclick="searchCars()">Search</button>
    </div>
    <div id="results"></div>
  </div>
  <script>
    const carInventory = [
      { make: "Ford", model: "F-150", year: "2019", dealer: "Madison Ford", link: "https://www.madisonfordin.com/used-vehicles/", price: "$29,995" },
      { make: "Toyota", model: "Camry", year: "2018", dealer: "Toyota of Madison", link: "https://www.toyotaofmadison.net/used-cars-madison-indiana.html", price: "$18,500" },
      { make: "Jeep", model: "Grand Cherokee", year: "2020", dealer: "Madison CDJR", link: "https://www.madisoncdjr.com/used-vehicles/", price: "$32,000" },
      { make: "Chevrolet", model: "Equinox", year: "2017", dealer: "Chandler Select", link: "https://www.chandlerselect.com/newandusedcars", price: "$15,900" },
      { make: "Hyundai", model: "Tucson", year: "2022", dealer: "Chandler Select", link: "https://www.chandlerselect.com/newandusedcars", price: "$24,800" }
    ];

    window.onload = function() {
      populateDropdowns(carInventory);
      displayCars(carInventory);
    };

    function populateDropdowns(data) {
      const makes = [...new Set(data.map(car => car.make))];
      const models = [...new Set(data.map(car => car.model))];
      const years = [...new Set(data.map(car => car.year))].sort((a, b) => b - a);

      document.getElementById("make").innerHTML = '<option value="">All Makes</option>' + makes.map(m => `<option value="${m}">${m}</option>`).join("");
      document.getElementById("model").innerHTML = '<option value="">All Models</option>' + models.map(m => `<option value="${m}">${m}</option>`).join("");
      document.getElementById("year").innerHTML = '<option value="">All Years</option>' + years.map(y => `<option value="${y}">${y}</option>`).join("");
    }

    function searchCars() {
      const make = document.getElementById("make").value.toLowerCase();
      const model = document.getElementById("model").value.toLowerCase();
      const year = document.getElementById("year").value;

      const filtered = carInventory.filter(car =>
        (make === "" || car.make.toLowerCase() === make) &&
        (model === "" || car.model.toLowerCase() === model) &&
        (year === "" || car.year === year)
      );

      displayCars(filtered);
    }

    function displayCars(cars) {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (cars.length === 0) {
        resultsDiv.innerHTML = "<p>No cars found matching your criteria in Madison, IN.</p>";
        return;
      }

      cars.forEach(car => {
        const div = document.createElement("div");
        div.className = "car-result";
        div.innerHTML = `
          <h3><a href="${car.link}" target="_blank">${car.year} ${car.make} ${car.model}</a></h3>
          <p>${car.price} — ${car.dealer}</p>
        `;
        resultsDiv.appendChild(div);
      });
    }
  </script>
</body>
</html>
